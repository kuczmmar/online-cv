<head>
  <title>{{ site.title }}</title>

  <!-- Meta -->
  <meta charset="utf-8">
  {% if site.chrome_mobile_color %}
  <meta name="theme-color" content="{{ site.chrome_mobile_color }}">
  {% endif%}
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description |default: "A beautiful
  Jekyll theme for creating resume" }}">
  <meta property="og:image" content="https://raw.githubusercontent.com/kuczmmar/online-cv/master/assets/images/preview.png"/>
  <meta name="title" property="og:title" content="{{ site.title }}" />
  <meta name="author" content="{{ site.name }}" />
  <!-- Favicon -->
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Plugins CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/font-awesome/css/all.css">

  <!-- Theme CSS -->
  <link id="theme-style" rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            theme: '#A15277',
            'theme-light': '#C47C9A',
            'theme-dark': '#6B3652',
          }
        }
      }
    }
  </script>
</head>
